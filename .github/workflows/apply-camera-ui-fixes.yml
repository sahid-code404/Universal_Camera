name: Apply Camera UI fixes

on:
  push:
    branches: [ "fix/progressive-discovery-fast-switch-ota-icon" ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply Camera UI fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/progressive-discovery-fast-switch-ota-icon
          fetch-depth: 0
      - name: Patch CameraScreen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/sahidcode404/camera/ui/CameraScreen.kt')
          s = p.read_text()

          s = s.replace(
              'import androidx.compose.material3.Button\n',
              'import androidx.compose.material3.AlertDialog\nimport androidx.compose.material3.Button\n',
              1,
          )
          s = s.replace(
              'import com.sahidcode404.camera.core.model.CaptureMode\n',
              'import com.sahidcode404.camera.core.model.CameraSessionState\nimport com.sahidcode404.camera.core.model.CaptureMode\n',
              1,
          )

          s = s.replace(
              '    var backgroundUpdate by remember { mutableStateOf<AvailableUpdate?>(null) }\n\n'
              '    LaunchedEffect(Unit) {\n'
              '        when (val result = UpdateAutoChecker(context.applicationContext, updaterClient).checkIfDue()) {\n'
              '            is UpdateCheckResult.Available -> backgroundUpdate = result.update\n'
              '            else -> Unit\n'
              '        }\n'
              '    }\n',
              '    var backgroundUpdate by remember { mutableStateOf<AvailableUpdate?>(null) }\n'
              '    var updatePromptDismissed by remember { mutableStateOf(false) }\n'
              '    var updateInstallStatus by remember { mutableStateOf<String?>(null) }\n'
              '    val previewState by previewController.state.collectAsStateWithLifecycle()\n\n'
              '    // Check GitHub on every app launch. A stale 12-hour throttle made freshly published\n'
              '    // OTA releases invisible during hardware testing.\n'
              '    LaunchedEffect(Unit) {\n'
              '        when (val result = updaterClient.check()) {\n'
              '            is UpdateCheckResult.Available -> {\n'
              '                backgroundUpdate = result.update\n'
              '                updatePromptDismissed = false\n'
              '            }\n'
              '            else -> Unit\n'
              '        }\n'
              '    }\n\n'
              '    // Start expensive AUX/NDK discovery only after the primary viewfinder is alive.\n'
              '    LaunchedEffect(previewState) {\n'
              '        if (previewState == CameraSessionState.PREVIEW) vm.onPreviewStreaming()\n'
              '    }\n',
              1,
          )

          s = s.replace(
              '                !lens.supportsRaw || lens.validation.rawStillUsable != true ->\n'
              '                    captureStatus = "RAW capture unavailable on this lens"\n',
              '                !lens.supportsRaw -> captureStatus = "RAW capture unavailable on this lens"\n',
              1,
          )

          s = s.replace(
              '        if (state.discoveryRunning) {\n'
              '            Text("Discovering cameras…", color = Color.White, fontSize = 12.sp, modifier = Modifier.align(Alignment.Center))\n'
              '        }\n',
              '',
              1,
          )

          marker = '''    if (showSettings) {\n'''
          dialog = '''    if (backgroundUpdate != null && !updatePromptDismissed) {\n        val update = backgroundUpdate!!\n        AlertDialog(\n            onDismissRequest = { updatePromptDismissed = true },\n            title = { Text("Camera ${update.manifest.versionName} available") },\n            text = {\n                Text(\n                    update.manifest.changelog.takeIf { it.isNotBlank() }\n                        ?: "A newer Camera build is ready. Download, verify and install the update.",\n                )\n            },\n            confirmButton = {\n                Button(\n                    onClick = {\n                        captureScope.launch {\n                            updateInstallStatus = "Downloading update…"\n                            updaterClient.downloadAndVerify(update)\n                                .onSuccess { apk ->\n                                    if (ApkInstaller.canRequestInstalls(context)) {\n                                        updateInstallStatus = null\n                                        ApkInstaller.install(context, apk)\n                                    } else {\n                                        updateInstallStatus = "Allow Camera to install updates, then return and tap Update again."\n                                        ApkInstaller.openUnknownSourcesSettings(context)\n                                    }\n                                }\n                                .onFailure { error ->\n                                    updateInstallStatus = "Update failed: ${error.message ?: error.javaClass.simpleName}"\n                                }\n                        }\n                    },\n                ) { Text("Update") }\n            },\n            dismissButton = {\n                Button(onClick = { updatePromptDismissed = true }) { Text("Later") }\n            },\n        )\n    }\n\n    updateInstallStatus?.let { status ->\n        Surface(\n            color = Color(0xEE18191C),\n            contentColor = Color.White,\n            shape = RoundedCornerShape(14.dp),\n            modifier = Modifier.padding(horizontal = 24.dp),\n        ) {\n            Text(status, modifier = Modifier.padding(14.dp), fontSize = 12.sp)\n        }\n    }\n\n'''
          if dialog not in s:
              s = s.replace(marker, dialog + marker, 1)

          p.write_text(s)
          PY

          rm -f .github/workflows/apply-camera-ui-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sahidcode404/camera/ui/CameraScreen.kt .github/workflows/apply-camera-ui-fixes.yml
          git commit -m "chore: apply Camera UI fixes"
          git push origin HEAD:fix/progressive-discovery-fast-switch-ota-icon
