name: Android CI

on:
  push:
    branches: [ main, "phase/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build, unit test and lint
        run: |
          gradle :core:model:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
          gradle :app:assembleRelease \
            -PcameraVersionName="0.1.4" \
            -PcameraVersionCode="5" \
            --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload Camera 0.1.4 unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-0.1.4-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
