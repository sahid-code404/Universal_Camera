name: Signed GitHub Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/camera-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/camera-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          gradle :app:assembleRelease -PcameraVersionName="$VERSION_NAME" -PcameraVersionCode="$VERSION_CODE" --stacktrace

      - name: Prepare release assets
        env:
          CERT_SHA: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          APK_SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          APK="Camera-${VERSION_NAME}.apk"
          cp "$APK_SRC" "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          python3 - <<PY
          import json, os
          manifest = {
            "schema": 1,
            "versionCode": int(os.environ.get("VERSION_CODE", "${VERSION_CODE}")),
            "versionName": "${VERSION_NAME}",
            "minSdk": 28,
            "apkAssetName": "${APK}",
            "sha256": "${SHA}",
            "signingCertSha256": "${CERT_SHA}",
            "changelog": "See GitHub release notes for ${GITHUB_REF_NAME}.",
            "mandatory": False,
          }
          open("release-manifest.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "Camera-${VERSION_NAME}.apk" release-manifest.json --generate-notes --title "Camera ${GITHUB_REF_NAME}"
