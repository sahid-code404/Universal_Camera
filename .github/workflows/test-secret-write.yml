name: Test Actions Secret Write

on:
  push:
    branches: [ "test/actions-secret-write" ]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try repository secret write with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' 'ok' | gh secret set OTA_SECRET_SETUP_TEST --repo "$GITHUB_REPOSITORY"
