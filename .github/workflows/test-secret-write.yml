name: Test Actions Secret Write

on:
  push:
    branches: [ "test/actions-secret-write" ]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try repository secret write with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output="$(printf '%s' 'ok' | gh secret set OTA_SECRET_SETUP_TEST --repo "$GITHUB_REPOSITORY" 2>&1)"
          rc=$?
          set -e
          {
            echo "exit_code=$rc"
            printf '%s\n' "$output" | sed -E 's/(token|authorization|bearer)[^ ]*/<redacted>/Ig'
          } > secret-write-result.txt
      - name: Commit test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secret-write-result.txt
          git commit -m "test: record secret write capability" || exit 0
          git push
